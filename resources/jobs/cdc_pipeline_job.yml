resources:
  jobs:
    cdc_pipeline:
      name: databricks-cdc-pipeline
      email_notifications:
        on_failure:
          - ${var.notify_email}
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "America/Sao_Paulo"
        pause_status: PAUSED
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../../notebooks/00_setup.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          max_retries: 2
          min_retry_interval_millis: 60000

        - task_key: generate_events
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: ../../notebooks/01_generate_events.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          max_retries: 2
          min_retry_interval_millis: 60000

        - task_key: bronze
          depends_on:
            - task_key: generate_events
          notebook_task:
            notebook_path: ../../notebooks/02_bronze.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          max_retries: 2
          min_retry_interval_millis: 60000

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../../notebooks/03_silver.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          max_retries: 2
          min_retry_interval_millis: 60000

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../../notebooks/04_gold.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          max_retries: 2
          min_retry_interval_millis: 60000
